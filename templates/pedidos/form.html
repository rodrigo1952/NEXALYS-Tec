{% extends "base.html" %}
{% block titulo %}{{ titulo }} | NEXALYS Tec{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h2 class="h4 mb-1">{{ titulo }}</h2>
      <p class="text-muted small">El precio se toma del producto y el stock se descuenta automáticamente al guardar.</p>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "_campos_formulario.html" %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <a href="{% if pedido %}{% url 'pedidos:detalle' pedido.pk %}{% else %}{% url 'pedidos:lista' %}{% endif %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
