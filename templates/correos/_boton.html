{# Botón que funciona en Gmail y Outlook: una tabla con fondo azul marino y el enlace dentro. #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0;">
  <tr><td align="center" bgcolor="#0B1B3A" style="border-radius:8px;">
    <a href="{{ url }}" target="_blank" style="display:inline-block;padding:14px 30px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#FFFFFF;text-decoration:none;border-radius:8px;">{{ texto }}</a>
  </td></tr>
</table>
