{# Botón que funciona en Gmail y Outlook: una tabla azul (con degradado donde se puede) y el enlace dentro. #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0;">
  <tr><td align="center" bgcolor="#1A6FE8" style="background-color:#1A6FE8;background-image:linear-gradient(135deg,#2C86F7,#1460D9);border-radius:12px;">
    <a href="{{ url }}" target="_blank" style="display:inline-block;padding:14px 32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#FFFFFF;text-decoration:none;border-radius:12px;">{{ texto }}</a>
  </td></tr>
</table>
