{% extends "base.html" %}
{% block titulo %}Cambiar contraseña | NEXALYS Tec{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h2 class="h4 mb-3">Cambiar contraseña</h2>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "_campos_formulario.html" %}
        <button type="submit" class="btn btn-primary w-100">Cambiar contraseña</button>
      </form>
      <p class="mt-3 mb-0 text-center"><a href="{% url 'mi_cuenta' %}">Volver a mi cuenta</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
