{% extends "base.html" %}
{% block titulo %}{{ titulo }} | NEXALYS Tec{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h2 class="h4 mb-3">{{ titulo }}</h2>
      {% if producto and producto.imagen %}
        <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}" class="mb-3 rounded border" style="max-height:120px">
      {% endif %}
      <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        {% include "_campos_formulario.html" %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <a href="{% url 'catalogo:mis_productos' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
