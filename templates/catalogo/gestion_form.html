{% extends "base.html" %}
{% block titulo %}{{ titulo }} | NEXALYS Tec{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h2 class="h4 mb-3">{{ titulo }}</h2>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "_campos_formulario.html" %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <a href="{% url 'catalogo:gestion_lista' tipo %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
