{% extends "administracion/_consola.html" %}
{% block titulo %}{{ titulo }} | Administración | NEXALYS Tec{% endblock %}
{% block consola %}
<div class="row justify-content-center">
  <div class="col-xl-8">
    <a href="{% url 'catalogo:gestion_lista' tipo %}" class="btn-volver"><span class="flecha" aria-hidden="true">&larr;</span>Volver</a>
    <section class="panel-consola mt-2">
      <h1 class="h4 mb-3">{{ titulo }}</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "_campos_formulario.html" %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <a href="{% url 'catalogo:gestion_lista' tipo %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </section>
  </div>
</div>
{% endblock %}
