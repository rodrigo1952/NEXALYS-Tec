{% extends "base.html" %}
{% block titulo %}Registro | NEXALYS Tec{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h2 class="h4 mb-3">Crear cuenta</h2>
      <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Registrarme</button>
      </form>
      <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
