{% extends "cuentas/_centro.html" %}
{% block titulo %}Editar mis datos | NEXALYS Tec{% endblock %}
{% block centro %}
<a href="{% url 'mi_cuenta' %}" class="btn-volver"><span class="flecha" aria-hidden="true">&larr;</span>Volver a mi perfil</a>
<div class="tarjeta-cuenta tarjeta-cuenta--formulario">
  <h1 class="h4 mb-3">Editar mis datos</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "_campos_formulario.html" %}
    <button type="submit" class="btn btn-primary">Guardar cambios</button>
  </form>
</div>
{% endblock %}
