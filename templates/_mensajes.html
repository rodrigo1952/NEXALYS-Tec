{% for m in messages %}
  {# Los mensajes se pueden cerrar con la X; los de éxito e información se ocultan solos. #}
  <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} alert-dismissible fade show" role="alert"
       {% if m.tags == 'success' or m.tags == 'info' %}data-autocierre{% endif %}>
    {{ m }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
{% endfor %}
